<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>UAT is waking up | Wake Forest University</title>
<link rel="shortcut icon" href="https://prod.wp.cdn.aws.wfu.edu/wfu-gutenberg-quarantheme/assets/images/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="https://prod.wp.cdn.aws.wfu.edu/wfu-gutenberg-quarantheme/assets/images/apple-touch-icon.png" />
<link rel="stylesheet" href="https://wakealert.wfu.edu/downpage/style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,600;1,600&family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="uat-status.css">
</head>
<body>
<div class="outage-header__rule"></div>
<header class="outage-header">
	<div class="outage-header__inner">
		<h1 class="visually-hidden">Wake Forest University</h1>
		<img class="outage-header__logo" src="https://static.secure.wfu.edu/images/wake-forest-university-logo.svg" alt="">
	</div>
</header>
<main>
	<div class="content-container">
		<div class="text-container uat-status--waking">
			<img class="uat-status__deacon" src="https://uat.wp.cdn.aws.wfu.edu/wfu-gutenberg-quarantheme/assets/images/walking_deacon.gif" alt="" width="150" height="150">
			<p class="uat-status__eyebrow">WordPress test environment</p>
			<h2>UAT is waking up</h2>
			<p>This usually takes about four minutes. Keep this tab open and it will take you to the page you asked for as soon as UAT is ready.</p>
			<p class="uat-status__elapsed" aria-live="polite">Waiting <span id="uat-elapsed">0:00</span></p>
			<hr />
			<p class="contact-info">Wake Forest University | Winston-Salem NC 27109 | 336.758.5000</p>
		</div>
	</div>
</main>
<script>
	( function () {
		var started = Date.now();
		var out = document.getElementById( 'uat-elapsed' );
		setInterval( function () {
			var total = Math.floor( ( Date.now() - started ) / 1000 );
			var seconds = total % 60;
			out.textContent = Math.floor( total / 60 ) + ':' + ( seconds < 10 ? '0' : '' ) + seconds;
		}, 1000 );
	} )();
</script>
</body>
</html>
